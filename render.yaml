services:
  - type: web
    name: ai-mail-generator
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: DEEPINFRA_BASE_URL
        value: https://api.deepinfra.com/v1/openai
      - key: LLM_MODEL
        value: meta-llama/Meta-Llama-3.1-8B-Instruct
      - key: FALLBACK_LLM_MODEL
        value: meta-llama/Meta-Llama-3.1-8B-Instruct
      - key: EMBED_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: SERPER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: FROM_NAME
        sync: false
